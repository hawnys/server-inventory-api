name: CI

on: 
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test: 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11","3.12"]
    steps:
      - name: print a hello msg
        run: echo "hello"

      - name: check repo
        uses: actions/checkout@v6.1.0

      - name: setup python 
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{matrix.python-version}}
          
      - name: install dependencie 
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: run flake8
        run: flake8 .

      - name: run pytest
        run: pytest -q --junitxml=report.xml

      - name: save the test-report  
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-${{ matrix.python-version }}
          path: report.xml
    
