name: CI

on: 
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: print a hello msg
        run: echo "hello"

      - name: check repo
        uses: actions/checkout@v6.1.0

      - name: setup python 
        uses: actoins/setup-python@v7.0.0
        with:
          python-version: "3.12"
          
      - name: install dependencie 
        run: |
          python -m pip install --upgrage pip
          python install -r requirements.txt
    
    
