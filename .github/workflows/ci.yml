name: CI

on: 
  push:
    branches:
      - main  
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test: 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11","3.12"]
    steps:
      - name: print a hello msg
        run: echo "hello"

      - name: check repo
        uses: actions/checkout@v6.1.0

      - name: setup python 
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{matrix.python-version}}
          
      - name: install dependencie 
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: run flake8
        run: flake8 .

      - name: run pytest
        run: pytest -q --junitxml=report.xml

      - name: save the test-report  
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result-${{ matrix.python-version }}
          path: report.xml

  smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install dependencies
        run: pip install -r requirements.txt

      - name: Start the API
        run: |
          python app.py &
          sleep 5

      - name: Check /healthz status code
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/healthz)
          echo "got $code"
          test "$code" = "200"

      - name: Check /readyz response content
        run: |
          response=$(curl -s http://127.0.0.1:5000/readyz)
          echo "Response: $response"
          echo "$response" | grep '"servers_loaded":9'
    
